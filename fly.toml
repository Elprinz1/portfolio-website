app = 'princewill-portfolio'
primary_region = 'sjc'

[build]

[http_service]
internal_port = 8080
force_https = true
# A static site has no state, so machines can sleep when idle and cold-start on
# the next request. This is what keeps the app inside Fly's free tier.
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = 'shared-cpu-1x'
memory = '256mb'
